# Template Registry v2 (§2.1, §5.1).
#
# Core selects a template by business.category, then renders/deploys the
# matching TemplateManifest. Real Next.js/Lovable templates are audited and
# published separately (their Vercel projects are wired via
# VERCEL_TEMPLATE_PROJECTS); the ``local_renderer`` is the offline Jinja
# artifact used by browser QA and local smoke runs.
#
# v2 adds: a `templates` manifest block (per-template metadata + local
# renderer + deploy routing key), niche themes (spa/cosmetology/dental/coach),
# and category coverage for spa, cosmetology, dental and coaches.
preview_expiry_days: 30

# --- Template manifests -------------------------------------------------------
# deploy_key: routes to VERCEL_TEMPLATE_PROJECTS[deploy_key]; when unmapped the
# hosting adapter falls back to the default single Vercel project.
# local_renderer: Jinja file under templates/ used by LocalStubAdapter + QA.
# status: `live` = bespoke template project audited; `pending` = registered and
# renders locally, but no dedicated Vercel project wired yet (uses default).
templates:
  wellness-next-template:
    version: v1
    framework: next
    deploy_key: wellness
    local_renderer: preview_static.html
    required_sections: [hero, services, contact]
    status: live
    reference: https://kaapora.pt/pt
  massage-spa-template:
    version: v1
    framework: next
    deploy_key: massage_spa
    local_renderer: preview_massage_spa.html
    source_dir: site_templates/massage-spa
    required_sections: [hero, services, pricing, location, contact]
    status: live
    reference: https://kaapora.pt/pt
    notes: >-
      Kaapora-derived Next.js template (self-contained copy under source_dir).
      SITE_CONFIG-driven via src/lib/preview-config.ts — services + prices,
      location, WhatsApp booking, brand colors/logo/hero, bilingual structure.
  dental-next-template:
    version: v1
    framework: next
    deploy_key: dental
    local_renderer: preview_static.html
    required_sections: [hero, services, contact]
    status: pending
    notes: Regulated/medical vertical — no invented treatments or before/after claims
  coach-next-template:
    version: v1
    framework: next
    deploy_key: coach
    local_renderer: preview_static.html
    required_sections: [hero, services, contact]
    status: pending
    reference: https://tiago-rodrigues.lovable.app/
    notes: Separate offer test — reference is a Lovable/Vite SPA; bespoke Next template pending

